# Sized for a single low-traffic host: total memory limits ≈ 1.6 GB.
# Values come from the root .env (see .env.example).

x-service: &service
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '3' }

# Small Prisma pools: each service needs only a few connections.
# SMTP settings shared by the API (OTP emails) and worker (Email actions).
x-smtp: &smtp
  SMTP_ENDPOINT: ${SMTP_ENDPOINT:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  FROM_EMAIL: ${FROM_EMAIL:-}

x-db-url: &db-url postgresql://postgres:postgres@postgres:5432/integrix?connection_limit=3

services:
  postgres:
    <<: *service
    image: postgres:15-alpine
    container_name: integrix-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: integrix
    # Defaults assume a dedicated DB server; trim for a tiny workload.
    command: >
      postgres -c max_connections=30 -c shared_buffers=32MB -c work_mem=2MB
      -c maintenance_work_mem=16MB -c effective_cache_size=96MB
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources: { limits: { memory: 256m } }

  # Single-node KRaft broker: no Zookeeper JVM, capped heap.
  kafka:
    <<: *service
    image: apache/kafka:3.9.0
    container_name: integrix-kafka
    ports:
      - '9092:9092'
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # Containers use kafka:29092; host processes (bun run dev) use localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    # Port probe instead of a JVM-based CLI check every interval.
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9092 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources: { limits: { memory: 512m } }

  # Runs migrations + seed once, then exits.
  migrate:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      target: migrate
    container_name: integrix-migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/integrix
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: api }
    container_name: integrix-api
    ports:
      - '3000:3000'
    environment:
      <<: *smtp
      DATABASE_URL: *db-url
      WEB_URL: ${WEB_URL:-http://localhost:3001}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { memory: 192m } }

  hooks:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: hooks }
    container_name: integrix-hooks
    ports:
      - '3002:3002'
    environment:
      DATABASE_URL: *db-url
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { memory: 160m } }

  processor:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: processor }
    container_name: integrix-processor
    environment:
      DATABASE_URL: *db-url
      KAFKA_BROKER: kafka:29092
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 160m } }

  worker:
    <<: *service
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args: { SERVICE: worker }
    container_name: integrix-worker
    environment:
      DATABASE_URL: *db-url
      KAFKA_BROKER: kafka:29092
      <<: *smtp
      SOL_PRIVATE_KEY: ${SOL_PRIVATE_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 192m } }

  web:
    <<: *service
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        NEXT_PUBLIC_HOOKS_URL: ${NEXT_PUBLIC_HOOKS_URL:-http://localhost:3002}
    container_name: integrix-web
    ports:
      - '3001:3001'
    depends_on:
      - api
    deploy:
      resources: { limits: { memory: 192m } }

volumes:
  postgres_data:
